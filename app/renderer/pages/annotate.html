<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Anotasi — AutomaEyes</title>
<link rel="stylesheet" href="../css/style.css">
<script>window.LAYOUT_OPTS = { title: 'Anotasi', subtitle: 'Beri label dataset langsung di aplikasi', mode: 'setting', showTotalStatus: false };</script>
<style>
  .annot-wrap { display: grid; grid-template-columns: 210px 1fr 240px; gap: 10px; height: calc(100vh - 190px); }
  .pane { background: #fff; border: 1px solid #d0d7de; border-radius: 3px; display: flex; flex-direction: column; min-height: 0; }
  .pane-head { padding: 6px 10px; border-bottom: 1px solid #e5e7eb; font-size: 11px; font-weight: 600; color: #444; }
  .pane-body { overflow: auto; padding: 6px; flex: 1; min-height: 0; }

  .img-item { padding: 5px 8px; font-size: 11px; border-radius: 3px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
  .img-item:hover { background: #f0f4f8; }
  .img-item.active { background: #e6f0ff; font-weight: 600; }
  .img-item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; align-self: center; }
  .dot.on { background: #22a34c; } .dot.off { background: #d0d7de; }

  #stage { flex: 1; position: relative; background: #1e1e1e; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #canvas { position: absolute; cursor: crosshair; }
  #imgEl { max-width: 100%; max-height: 100%; user-select: none; -webkit-user-drag: none; }

  .cls-btn { display: block; width: 100%; text-align: left; margin-bottom: 4px; font-size: 11px; padding: 5px 8px; border: 1px solid #d0d7de; background: #fff; border-radius: 3px; cursor: pointer; }
  .cls-btn.active { border-color: #0066cc; background: #e6f0ff; font-weight: 600; }
  .cls-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

  .shape-row { font-size: 11px; padding: 4px 6px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
  .shape-row:hover { background: #fff7ed; }
  .shape-row button { border: none; background: none; color: #dc2626; cursor: pointer; font-size: 13px; }
  .hint { font-size: 10px; color: #777; line-height: 1.7; }
  .toolbar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
  .badge-save { font-size: 11px; color: #22a34c; }
</style>
</head>
<body>

<main>
    <a class="back" onclick="back()">← Model</a>
    <div class="page-header">
        <h1 id="ttl">Anotasi</h1>
        <div class="row">
            <select id="splitSel" onchange="loadSplit()" style="font-size:12px">
                <option value="train">train</option>
                <option value="val">val</option>
                <option value="test">test</option>
            </select>
            <button class="btn" onclick="prevImg()">← Sebelumnya</button>
            <button class="btn" onclick="nextImg()">Berikutnya →</button>
            <button class="btn primary" onclick="save()">💾 Simpan (Ctrl+S)</button>
            <span class="badge-save" id="savedMsg"></span>
        </div>
    </div>

    <div class="annot-wrap">
        <div class="pane">
            <div class="pane-head">Gambar (<span id="imgCount">0</span>)</div>
            <div class="pane-body" id="imgList"></div>
        </div>

        <div class="pane">
            <div class="toolbar">
                <span id="modeLabel" class="hint"></span>
                <span style="flex:1"></span>
                <button class="btn small" onclick="undoShape()">↶ Undo</button>
                <button class="btn small" onclick="clearShapes()">Kosongkan</button>
            </div>
            <div id="stage">
                <img id="imgEl" alt="">
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <div class="pane">
            <div class="pane-head">Kelas</div>
            <div class="pane-body" style="flex:none; max-height:190px">
                <div id="classList"></div>
            </div>
            <div class="pane-head">Objek pada gambar ini (<span id="shapeCount">0</span>)</div>
            <div class="pane-body" id="shapeList"></div>
            <div class="pane-body" style="flex:none; border-top:1px solid #e5e7eb">
                <p class="hint" id="helpText"></p>
            </div>
        </div>
    </div>
</main>

<script src="../js/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const projectName = params.get('project') || '';
const modelName = params.get('model') || '';

const COLORS = ['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7','#06b6d4','#ec4899','#84cc16'];

let classes = [], aiType = 'AI Detection';
let images = [], idx = -1, split = 'train';
let shapes = [];          // {cls, cx, cy, w, h} atau {cls, poly:[...]}
let activeCls = 0;
let polyPts = [];         // poligon yang sedang digambar (segmentasi)
let drag = null;
let dirty = false;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imgEl = document.getElementById('imgEl');

function back() {
    window.api.goTo(`model.html?project=${encodeURIComponent(projectName)}&model=${encodeURIComponent(modelName)}`);
}

const isPolygon = () => aiType === 'AI Segmentation';
const isWholeImage = () => aiType === 'AI Classification';

async function init() {
    const p = await window.api.loadProject(projectName);
    const m = (p.models || []).find((x) => x.name === modelName);
    if (!m) { alert('Model tidak ditemukan'); return; }
    classes = m.classes || [];
    aiType = m.aiType || 'AI Detection';

    document.getElementById('ttl').textContent = `Anotasi — ${modelName}`;
    document.getElementById('modeLabel').textContent =
        isPolygon() ? 'Mode poligon (segmentasi)' : isWholeImage() ? 'Mode klasifikasi (1 kelas / gambar)' : 'Mode kotak (bounding box)';
    document.getElementById('helpText').innerHTML = isPolygon()
        ? 'Klik untuk menaruh titik. <strong>Klik kanan</strong> atau <strong>Enter</strong> untuk menutup poligon. Tombol <strong>1-9</strong> pilih kelas.'
        : isWholeImage()
            ? 'Pilih kelas untuk seluruh gambar, lalu Simpan. Tombol <strong>1-9</strong> pilih kelas.'
            : 'Drag untuk menggambar kotak. Tombol <strong>1-9</strong> pilih kelas, <strong>Del</strong> hapus objek terakhir.';

    renderClasses();
    await loadSplit();
}

function renderClasses() {
    document.getElementById('classList').innerHTML = classes.map((c, i) => `
        <button class="cls-btn ${i === activeCls ? 'active' : ''}" onclick="setClass(${i})">
            <span class="cls-swatch" style="background:${COLORS[i % COLORS.length]}"></span>${esc(c)} <span style="color:#999">(${i + 1})</span>
        </button>`).join('') || '<p class="hint">Model ini belum punya kelas.</p>';
}

function setClass(i) { activeCls = i; renderClasses(); }

async function loadSplit() {
    split = document.getElementById('splitSel').value;
    images = await window.api.annotList(projectName, modelName, split);
    document.getElementById('imgCount').textContent = images.length;
    renderImgList();
    if (images.length) selectImg(0); else { imgEl.src = ''; shapes = []; redraw(); }
}

function renderImgList() {
    document.getElementById('imgList').innerHTML = images.map((im, i) => `
        <div class="img-item ${i === idx ? 'active' : ''}" onclick="selectImg(${i})" title="${esc(im.name)}">
            <span class="nm">${esc(im.name)}</span>
            <span class="dot ${(im.boxes && im.boxes.length) ? 'on' : 'off'}"></span>
        </div>`).join('') || '<p class="hint">Belum ada gambar. Upload dulu di tab Dataset.</p>';
}

async function selectImg(i) {
    if (dirty && !confirm('Perubahan belum disimpan. Lanjut tanpa menyimpan?')) return;
    idx = i; dirty = false; polyPts = [];
    const im = images[i];

    const r = await window.api.annotImage(projectName, modelName, split, im.name);
    if (!r.ok) { alert(r.error); return; }

    // Bentuk yang sudah ada dimuat ulang supaya bisa dikoreksi, bukan ditimpa.
    shapes = (im.boxes || []).map((b) => b.poly
        ? { cls: b.cls, poly: b.poly.slice() }
        : { cls: b.cls, cx: b.cx, cy: b.cy, w: b.w, h: b.h });

    imgEl.onload = () => { fitCanvas(); redraw(); };
    imgEl.src = r.dataUrl;
    renderImgList();
}

function fitCanvas() {
    const r = imgEl.getBoundingClientRect();
    const st = document.getElementById('stage').getBoundingClientRect();
    canvas.width = r.width; canvas.height = r.height;
    canvas.style.left = (r.left - st.left) + 'px';
    canvas.style.top = (r.top - st.top) + 'px';
}
window.addEventListener('resize', () => { if (imgEl.src) { fitCanvas(); redraw(); } });

function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const W = canvas.width, H = canvas.height;

    shapes.forEach((s) => {
        const col = COLORS[s.cls % COLORS.length];
        ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.fillStyle = col + '22';
        if (s.poly) {
            ctx.beginPath();
            for (let i = 0; i < s.poly.length; i += 2) {
                const x = s.poly[i] * W, y = s.poly[i + 1] * H;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.closePath(); ctx.fill(); ctx.stroke();
        } else {
            const x = (s.cx - s.w / 2) * W, y = (s.cy - s.h / 2) * H;
            ctx.fillRect(x, y, s.w * W, s.h * H);
            ctx.strokeRect(x, y, s.w * W, s.h * H);
            ctx.fillStyle = col; ctx.font = '11px sans-serif';
            ctx.fillText(classes[s.cls] || s.cls, x + 3, y - 3);
        }
    });

    if (polyPts.length) {
        ctx.strokeStyle = COLORS[activeCls % COLORS.length]; ctx.lineWidth = 2;
        ctx.beginPath();
        polyPts.forEach((p, i) => (i === 0 ? ctx.moveTo(p[0] * W, p[1] * H) : ctx.lineTo(p[0] * W, p[1] * H)));
        ctx.stroke();
        polyPts.forEach((p) => ctx.fillRect(p[0] * W - 2, p[1] * H - 2, 5, 5));
    }

    if (drag) {
        ctx.strokeStyle = COLORS[activeCls % COLORS.length]; ctx.setLineDash([4, 3]); ctx.lineWidth = 2;
        ctx.strokeRect(drag.x0 * W, drag.y0 * H, (drag.x1 - drag.x0) * W, (drag.y1 - drag.y0) * H);
        ctx.setLineDash([]);
    }

    document.getElementById('shapeCount').textContent = shapes.length;
    document.getElementById('shapeList').innerHTML = shapes.map((s, i) => `
        <div class="shape-row">
            <span><span class="cls-swatch" style="background:${COLORS[s.cls % COLORS.length]}"></span>${esc(classes[s.cls] || s.cls)}${s.poly ? ' (poligon)' : ''}</span>
            <button onclick="delShape(${i})" title="Hapus">✕</button>
        </div>`).join('') || '<p class="hint">Belum ada objek.</p>';
}

function relPos(e) {
    const r = canvas.getBoundingClientRect();
    return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
            Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
}

canvas.addEventListener('mousedown', (e) => {
    if (!imgEl.src || isWholeImage()) return;
    const [x, y] = relPos(e);
    if (isPolygon()) {
        if (e.button === 2) return;
        polyPts.push([x, y]); redraw(); return;
    }
    drag = { x0: x, y0: y, x1: x, y1: y };
});
canvas.addEventListener('mousemove', (e) => {
    if (!drag) return;
    [drag.x1, drag.y1] = relPos(e); redraw();
});
canvas.addEventListener('mouseup', () => {
    if (!drag) return;
    const w = Math.abs(drag.x1 - drag.x0), h = Math.abs(drag.y1 - drag.y0);
    // Klik tanpa geser (kotak sangat kecil) dianggap salah pencet, bukan objek.
    if (w > 0.005 && h > 0.005) {
        shapes.push({ cls: activeCls, cx: (drag.x0 + drag.x1) / 2, cy: (drag.y0 + drag.y1) / 2, w, h });
        dirty = true;
    }
    drag = null; redraw();
});
canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); closePoly(); });

function closePoly() {
    if (polyPts.length >= 3) {
        shapes.push({ cls: activeCls, poly: polyPts.flat() });
        dirty = true;
    }
    polyPts = []; redraw();
}

function delShape(i) { shapes.splice(i, 1); dirty = true; redraw(); }
function undoShape() { if (polyPts.length) polyPts.pop(); else shapes.pop(); dirty = true; redraw(); }
function clearShapes() { if (confirm('Kosongkan semua objek di gambar ini?')) { shapes = []; polyPts = []; dirty = true; redraw(); } }

async function save() {
    if (idx < 0) return;
    let out = shapes;
    if (isWholeImage()) out = [{ cls: activeCls, cx: 0.5, cy: 0.5, w: 1, h: 1 }];

    const r = await window.api.annotSave(projectName, modelName, split, images[idx].name, out);
    if (!r.ok) { alert('Gagal simpan: ' + r.error); return; }

    dirty = false;
    images[idx].boxes = out;
    renderImgList();
    const el = document.getElementById('savedMsg');
    el.textContent = `Tersimpan (${r.count} objek)`;
    setTimeout(() => { el.textContent = ''; }, 1800);
}

function prevImg() { if (idx > 0) selectImg(idx - 1); }
function nextImg() { if (idx < images.length - 1) selectImg(idx + 1); }

document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
    if (e.key >= '1' && e.key <= '9') { const i = +e.key - 1; if (i < classes.length) setClass(i); }
    else if (e.key === 'Enter' && isPolygon()) closePoly();
    else if (e.key === 'Delete') { shapes.pop(); dirty = true; redraw(); }
    else if (e.key === 'ArrowLeft') prevImg();
    else if (e.key === 'ArrowRight') nextImg();
});

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Workflow — AutomaEyes</title>
<link rel="stylesheet" href="../css/style.css">
<script>window.LAYOUT_OPTS = { title: 'Workflow', subtitle: 'Langkah 2 · urutan pemeriksaan', mode: 'setting', showTotalStatus: false };</script>
</head>
<body>

<main>
    <div class="page-header">
        <a class="back" id="backLink">← Project</a>
        <div class="row" style="align-items:center; gap:10px">
            <button class="btn primary" onclick="saveWorkflow()">💾 Simpan Workflow</button>
            <span class="save-msg" id="simpanMsg" role="status" aria-live="polite"></span>
        </div>
    </div>

    <div class="workflow-layout">
        <div class="palette" id="palette"></div>
        <div class="props" id="props">
            <div class="props-header">Pengaturan Step</div>
            <div class="props-body" id="propsBody">
                <p class="muted">Pilih salah satu step di kiri untuk mengatur rinciannya.</p>
                <hr style="margin: 12px 0; border: none; border-top: 1px solid var(--border);">
            <div id="ngRuleHost"></div>
            </div>
        </div>
    </div>

    <div id="periksa" class="flow-next"></div>
</main>

<script src="../js/common.js"></script>
<script>
const projectName = param('project');
document.getElementById('backLink').onclick = () => window.api.goTo(`project.html?name=${encodeURIComponent(projectName)}`);

const CATEGORIES = ['Capture', 'Positioning', 'Inspection', 'Communication', 'Options'];
// Workflow dijalankan berurutan dari atas ke bawah. Tanpa keterangan ini
// urutannya harus ditebak - dan menaruh Communication sebelum Inspection
// berarti mengirim hasil sebelum ada yang dinilai.
const CAT_INFO = {
    Capture:       'Ambil gambarnya dulu',
    Positioning:   'Kunci posisi part (opsional)',
    Inspection:    'Nilai OK / NG',
    Communication: 'Kirim hasil ke Arduino / catat log',
    Options:       'Simpan gambar (opsional)',
};
// Kategori yang memakai MODEL AI (butuh model terlatih). Lainnya pakai "tool".
const MODEL_CATS = ['Inspection', 'Positioning'];
// Katalog tool non-AI per kategori (Capture/Communication/Options).
const TOOLS = {
    Capture: [
        { tool: 'camera', label: 'Kamera / Webcam', config: { source: 'kamera', minKB: 0 } },
        { tool: 'file', label: 'Muat dari File', config: { source: 'file', minKB: 0 } },
    ],
    Communication: [
        { tool: 'arduino', label: 'Sinyal Arduino/PLC', config: { signalOK: '0', signalNG: '1', onlyOnNG: true } },
        { tool: 'log', label: 'Catat Log CSV', config: {} },
    ],
    Options: [
        { tool: 'save', label: 'Simpan Gambar', config: { saveOK: false, saveNG: true } },
    ],
};
let steps = [];
let availableModels = [];
let selectedIdx = -1;

// Disimpan di variabel, bukan dibaca dari DOM. Panel properti ditulis ulang
// setiap render, jadi select-nya lahir baru dengan nilai bawaan: project yang
// menyimpan "continue" tetap tampil "stop_and_report", dan menekan Simpan
// menimpanya diam-diam. Ini pengaturan keselamatan - apakah inspeksi berhenti
// saat menemukan NG - jadi tidak boleh berubah sendiri.
let onFirstNG = 'stop_and_report';
let adaPerubahan = false;

function aturanNG() {
    return `<label>Kalau ada step yang menilai NG:
        <select onchange="setOnFirstNG(this.value)">
            <option value="stop_and_report" ${onFirstNG === 'stop_and_report' ? 'selected' : ''}>Berhenti dan laporkan NG</option>
            <option value="continue" ${onFirstNG === 'continue' ? 'selected' : ''}>Lanjutkan sisa step-nya</option>
        </select></label>
        <p class="muted" style="font-size:11px;margin:4px 0 0">Berhenti lebih cepat; melanjutkan memberi laporan lengkap semua step.</p>`;
}

function setOnFirstNG(v) { onFirstNG = v; adaPerubahan = true; }

async function init() {
    const p = await window.api.loadProject(projectName);
    steps = (p.workflow.steps || []).map(s => ({ ...s }));
    availableModels = p.models || [];
    onFirstNG = p.workflow.onFirstNG || 'stop_and_report';
    render();
}

function render() {
    const palette = document.getElementById('palette');
    palette.innerHTML = CATEGORIES.map(cat => {
        const catSteps = steps.filter(s => s.category === cat);
        return `
            <div class="palette-cat">
                <div class="palette-header">
                    <div><span class="cat-icon"></span>${esc(cat)}
                        <span class="cat-info">${esc(CAT_INFO[cat] || '')}</span></div>
                    <button class="palette-add-btn" onclick="addStep('${esc(cat)}')" title="Tambah step">+</button>
                </div>
                <div class="palette-body">
                    ${catSteps.length ? catSteps.map(s => {
                        const idx = steps.indexOf(s);
                        return `<div class="palette-step ${idx === selectedIdx ? 'selected' : ''}" onclick="selectStep(${idx})">
                            <span class="step-num">${idx + 1}</span>
                            <span>${esc(s.modelName || s.label || s.tool || s.category)}</span>
                            <span class="verdict-dot"></span>
                        </div>`;
                    }).join('') : '<div class="palette-empty">(kosong)</div>'}
                </div>
            </div>
        `;
    }).join('');

    renderProps();
    renderPeriksa();
}

// Workflow yang tidak lengkap baru ketahuan saat dijalankan di lini produksi.
// Lebih baik dikatakan di sini, sebagai catatan - bukan larangan, karena
// workflow setengah jadi wajar disimpan dulu.
function renderPeriksa() {
    const el = document.getElementById('periksa');
    if (!el) return;
    const punya = (c) => steps.some((s2) => s2.category === c);
    const kurang = [];
    if (!punya('Capture')) kurang.push('belum ada step <strong>Capture</strong> — tidak ada gambar yang masuk');
    if (!punya('Inspection')) kurang.push('belum ada step <strong>Inspection</strong> — tidak ada yang dinilai OK/NG');

    const belumLatih = steps.filter((s2) => {
        if (!s2.modelName) return false;
        const m = availableModels.find((x) => x.name === s2.modelName);
        return !m || !m.trained;
    }).map((s2) => s2.modelName);
    if (belumLatih.length) kurang.push(`model belum dilatih: <strong>${belumLatih.map(esc).join(', ')}</strong>`);

    if (!steps.length) {
        el.className = 'flow-next';
        el.innerHTML = '<span class="muted">Belum ada step. Mulai dari <strong>Capture</strong> di kiri, lalu tambahkan <strong>Inspection</strong>.</span>';
        return;
    }
    if (kurang.length) {
        el.className = 'flow-next periksa-warn';
        el.innerHTML = `<span class="muted">Masih perlu dilengkapi: ${kurang.join(' · ')}.</span>`;
        return;
    }
    el.className = 'flow-next';
    el.innerHTML = `<span class="muted">Workflow lengkap: ${steps.length} step. Berikutnya atur cara hasilnya dikirim keluar.</span>
        <button class="btn small primary" id="keOutput">Langkah 3 &middot; Output &rarr;</button>`;
    el.querySelector('#keOutput').onclick =
        () => window.api.goTo(`output.html?project=${encodeURIComponent(projectName)}`);
}

function renderProps() {
    const body = document.getElementById('propsBody');
    if (selectedIdx < 0) {
        body.innerHTML = `<p class="muted">Pilih salah satu step di kiri untuk mengatur rinciannya.</p>
            <hr style="margin:12px 0; border:none; border-top:1px solid var(--border);">
            ${aturanNG()}`;
        return;
    }
    const s = steps[selectedIdx];
    const isModel = !!s.modelName;
    let head, configHtml = '';
    if (isModel) {
        const m = availableModels.find(x => x.name === s.modelName);
        const trained = m && m.trained ? (m.lastMAP != null ? `sudah dilatih (mAP ${m.lastMAP.toFixed(3)})` : 'sudah dilatih') : '⚠ belum dilatih';
        head = `<h3>Step [${selectedIdx + 1}] — ${esc(s.modelName)}</h3>
            <p class="muted">Jenis: <strong>${m ? esc(m.type) : '?'}</strong> · ${trained}<br>
            ${s.category === 'Positioning' ? 'Peran: mengunci lokasi part (bukan menilai).' : 'Peran: menilai OK/NG lewat add-on.'}</p>`;
        // Pilih VERSI model (v1, v2, …) untuk step ini. Kosong = pakai versi aktif.
        let verHtml = '';
        if (m && m.versions && m.versions.length) {
            verHtml = `<label style="display:block;margin-bottom:6px">Versi model
                <select onchange="updateStep('version', this.value ? (parseInt(this.value) || null) : null)">
                    <option value="" ${!s.version ? 'selected' : ''}>Aktif (v${m.activeVersion || '?'})</option>
                    ${m.versions.slice().reverse().map(v => `<option value="${v.id}" ${s.version === v.id ? 'selected' : ''}>v${v.id}${v.id === m.activeVersion ? ' · aktif' : ''}</option>`).join('')}
                </select></label>`;
        }
        const pass = (s.config && s.config.passOnNoDetect) ? 'checked' : '';
        configHtml = verHtml + `<label style="display:block;margin-bottom:6px"><input type="checkbox" ${pass} onchange="updateStepConfig('passOnNoDetect', this.checked)"> Anggap <strong>OK</strong> bila tidak ada objek terdeteksi (lanjut ke step berikutnya)</label>`;
    } else {
        head = `<h3>Step [${selectedIdx + 1}] — ${esc(s.label || s.tool)}</h3>
            <p class="muted">Tool ${esc(s.category)}.</p>`;
        configHtml = renderStepConfig(s);
    }
    body.innerHTML = `${head}
        <hr style="margin:12px 0; border:none; border-top:1px solid var(--border);">
        ${configHtml}
        <label>Lanjut ke step berikutnya
            <select onchange="updateStep('continueOn', this.value)">
                <option value="always" ${s.continueOn === 'always' ? 'selected' : ''}>Selalu</option>
                <option value="on_ok" ${s.continueOn === 'on_ok' ? 'selected' : ''}>Hanya kalau step ini OK</option>
                <option value="on_ng" ${s.continueOn === 'on_ng' ? 'selected' : ''}>Hanya kalau step ini NG</option>
            </select>
        </label>
        <div class="row">
            <button class="btn small" onclick="move(-1)">↑ Naik</button>
            <button class="btn small" onclick="move(1)">↓ Turun</button>
            <button class="btn small danger" onclick="removeStep()">🗑 Hapus step</button>
        </div>
        <hr style="margin:12px 0; border:none; border-top:1px solid var(--border);">
            ${aturanNG()}`;
}

// Editor konfigurasi untuk step non-model (Capture/Communication/Options).
function renderStepConfig(s) {
    const c = s.config || {};
    if (s.category === 'Capture') {
        return `<label>Sumber
                <select onchange="updateStepConfig('source', this.value)">
                    <option value="kamera" ${c.source === 'kamera' ? 'selected' : ''}>Kamera / Webcam</option>
                    <option value="file" ${c.source === 'file' ? 'selected' : ''}>Muat dari File</option>
                </select></label>
            <label>Min. ukuran gambar (KB) — 0 = mati
                <input type="number" min="0" value="${c.minKB || 0}" onchange="updateStepConfig('minKB', parseInt(this.value)||0)"></label>
            <p class="muted" style="font-size:11px">Gate opsional: tolak gambar terlalu kecil/kosong (indikasi gagal capture).</p>`;
    }
    if (s.category === 'Communication') {
        if (s.tool === 'log') return `<p class="muted" style="font-size:12px">Menulis hasil ke daily_summary.csv (otomatis). Tidak ada parameter.</p>`;
        return `<label>Sinyal saat OK <input type="text" value="${esc(c.signalOK != null ? c.signalOK : '0')}" onchange="updateStepConfig('signalOK', this.value)"></label>
            <label>Sinyal saat NG <input type="text" value="${esc(c.signalNG != null ? c.signalNG : '1')}" onchange="updateStepConfig('signalNG', this.value)"></label>
            <label style="display:block"><input type="checkbox" ${c.onlyOnNG !== false ? 'checked' : ''} onchange="updateStepConfig('onlyOnNG', this.checked)"> Kirim hanya saat NG</label>
            <p class="muted" style="font-size:11px">Butuh Arduino terhubung (Settings → COM port).</p>`;
    }
    if (s.category === 'Options') {
        return `<label style="display:block"><input type="checkbox" ${c.saveOK ? 'checked' : ''} onchange="updateStepConfig('saveOK', this.checked)"> Simpan gambar OK</label>
            <label style="display:block"><input type="checkbox" ${c.saveNG !== false ? 'checked' : ''} onchange="updateStepConfig('saveNG', this.checked)"> Simpan gambar NG</label>
            <p class="muted" style="font-size:11px">Gambar tersimpan di folder outputs/ project.</p>`;
    }
    return '';
}

function updateStepConfig(key, value) {
    adaPerubahan = true;
    if (selectedIdx < 0) return;
    const s = steps[selectedIdx];
    s.config = s.config || {};
    s.config[key] = value;
}

// Pemilih step berbasis modal (prompt() TIDAK didukung di Electron).
// Inspection & Positioning → pilih MODEL AI. Capture/Communication/Options → pilih TOOL.
function addStep(cat) {
    closePicker();
    const isModelCat = MODEL_CATS.includes(cat);
    const overlay = document.createElement('div');
    overlay.id = 'modelPicker';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000';
    const box = document.createElement('div');
    box.style.cssText = 'background:var(--panel,#fff);color:var(--text,inherit);border:1px solid var(--border,#ccc);border-radius:8px;padding:18px;min-width:340px;max-width:90%;max-height:80vh;overflow:auto';

    if (isModelCat && !availableModels.length) {
        box.innerHTML = `<h3 style="margin-top:0">Tambah step — ${esc(cat)}</h3>
            <p class="muted">Belum ada model di project ini. Buat &amp; latih model dulu:
            <strong>Project → Model Baru → Langkah 1-5</strong>.</p>
            <div class="row" style="justify-content:flex-end"><button class="btn" id="pkClose">Tutup</button></div>`;
    } else {
        const hint = isModelCat
            ? 'Pilih model AI yang dijalankan pada langkah ini:'
            : 'Pilih tool untuk langkah ini:';
        box.innerHTML = `<h3 style="margin-top:0">Tambah step ke <em>${esc(cat)}</em></h3>
            <p class="muted">${hint}</p>
            <div id="pkList" style="display:flex;flex-direction:column;gap:6px;margin:10px 0"></div>
            <div class="row" style="justify-content:flex-end"><button class="btn" id="pkClose">Tutup</button></div>`;
    }
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closePicker(); });
    const closeBtn = box.querySelector('#pkClose');
    if (closeBtn) closeBtn.onclick = closePicker;

    const list = box.querySelector('#pkList');
    if (!list) return;

    if (isModelCat) {
        availableModels.forEach(m => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.style.cssText = 'text-align:left;justify-content:flex-start';
            btn.innerHTML = `<strong>${esc(m.name)}</strong> ` +
                `<span class="muted" style="font-size:11px">— ${esc(m.type)}${m.trained ? ' · trained' : ' · belum trained'}</span>`;
            btn.onclick = () => {
                steps.push({ modelName: m.name, category: cat, continueOn: 'always' });
                adaPerubahan = true;
                selectedIdx = steps.length - 1;
                closePicker();
                render();
            };
            list.appendChild(btn);
        });
    } else {
        (TOOLS[cat] || []).forEach(t => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.style.cssText = 'text-align:left;justify-content:flex-start';
            btn.innerHTML = `<strong>${esc(t.label)}</strong>`;
            btn.onclick = () => {
                steps.push({ category: cat, tool: t.tool, label: t.label, config: { ...t.config }, continueOn: 'always' });
                adaPerubahan = true;
                selectedIdx = steps.length - 1;
                closePicker();
                render();
            };
            list.appendChild(btn);
        });
    }
}

function closePicker() {
    const ex = document.getElementById('modelPicker');
    if (ex) ex.remove();
}

function selectStep(idx) {
    selectedIdx = idx;
    render();
}

function updateStep(key, value) {
    adaPerubahan = true;
    if (selectedIdx < 0) return;
    steps[selectedIdx][key] = value;
    render();
}

function move(dir) {
    adaPerubahan = true;
    if (selectedIdx < 0) return;
    const ni = selectedIdx + dir;
    if (ni < 0 || ni >= steps.length) return;
    const tmp = steps[selectedIdx];
    steps[selectedIdx] = steps[ni];
    steps[ni] = tmp;
    selectedIdx = ni;
    render();
}

function removeStep() {
    adaPerubahan = true;
    if (selectedIdx < 0) return;
    steps.splice(selectedIdx, 1);
    selectedIdx = -1;
    render();
}

// Susunan step hanya ada di memori sampai ditekan Simpan. Tanpa peringatan
// ini, menutup jendela atau menekan "Project" membuang seluruh pekerjaan
// tanpa sepatah kata pun.
window.addEventListener('beforeunload', (e) => {
    if (adaPerubahan) { e.preventDefault(); e.returnValue = ''; }
});

// Pesan disampaikan di halaman, bukan lewat alert. Selain menghentikan
// seluruh jendela, alert menutupi susunan step yang baru saja diatur -
// padahal justru itu yang ingin dilihat setelah menyimpan.
let simpanTimer = null;
function pesanSimpan(teks, jenis) {
    const el = document.getElementById('simpanMsg');
    if (!el) return;
    clearTimeout(simpanTimer);
    el.textContent = teks;
    el.className = 'save-msg ' + jenis + ' tampil';
    // Kabar baik boleh menghilang sendiri; kabar buruk harus tetap terbaca.
    if (jenis === 'ok') simpanTimer = setTimeout(() => { el.classList.remove('tampil'); }, 3000);
}

async function saveWorkflow() {
    try {
        await window.api.saveWorkflow(projectName, steps, onFirstNG);
        adaPerubahan = false;
        pesanSimpan('✓ Workflow tersimpan', 'ok');
    } catch (e) {
        pesanSimpan('Gagal menyimpan: ' + e.message, 'err');
    }
}

init();
</script>
<script src="../js/layout.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Output — AutomaEyes</title>
<link rel="stylesheet" href="../css/style.css">
<script>window.LAYOUT_OPTS = { title: 'Output', subtitle: 'Langkah 3 · cara hasil dikirim keluar', mode: 'setting', showTotalStatus: false };</script>
<style>
  #script { width: 100%; height: 300px; font-family: Consolas, monospace; font-size: 12px; }
  .helper { font-size: 11px; color: var(--text-secondary); line-height: 1.7; }
  .test-out { font-family: Consolas, monospace; font-size: 11px; white-space: pre-wrap; margin-top: 8px; }
  .test-out.err { color: var(--ng); } .test-out.ok { color: var(--ok); }
</style>
</head>
<body>

<main>
    <a class="back" onclick="back()">← Project</a>
    <div class="page-header">
        <h1 id="pTitle">Output</h1>
        <div class="row" style="align-items:center; gap:10px">
            <button class="btn primary" onclick="simpan()">💾 Simpan</button>
            <span class="save-msg" id="simpanMsg" role="status" aria-live="polite"></span>
        </div>
    </div>

    <div class="card">
        <div class="section-title">Perangkat Keluaran</div>
        <div style="padding:12px">
            <p class="muted" style="margin-top:0">Pilih ke mana hasil inspeksi dikirim.</p>
            <div class="dev-grid" id="devGrid"></div>
            <p class="muted" id="devRingkas" style="font-size:11px; margin:10px 0 0"></p>
        </div>
    </div>

    <div class="card" id="kartuPin" style="display:none">
        <div class="section-title">Sinyal per Kelas</div>
        <div style="padding:12px">
            <p class="muted" style="margin-top:0" id="pinKet"></p>
            <div class="row" style="margin-bottom:10px; align-items:center; gap:8px">
                <button class="btn small" onclick="sambung()">🔌 Sambungkan</button>
                <button class="btn small" onclick="bukaSketsa()">📄 Sketsa untuk papan</button>
                <span class="muted" id="devStatus" style="font-size:11px"></span>
            </div>
            <div id="pinBody"></div>
        </div>
    </div>

    <div class="card" id="kartuScript" style="display:none">
        <div class="section-title">Kode Output</div>
        <div style="padding:12px">
            <div class="row" style="align-items:center; gap:10px; margin-bottom:10px">
                <button class="btn small" onclick="bukaBantuan()">? Bantuan &amp; contoh kode</button>
                <label class="pin-lab">Bahasa
                    <select id="bahasa" onchange="gantiBahasa(this.value)">
                        <option value="js">JavaScript</option>
                        <option value="py">Python</option>
                    </select>
                </label>
                <span class="muted" id="bahasaKet" style="font-size:11px"></span>
            </div>
            <textarea id="script" spellcheck="false"></textarea>
            <div class="row" style="margin-top:10px">
                <button class="btn" onclick="uji('OK')">▶ Uji dengan hasil OK</button>
                <button class="btn" onclick="uji('NG')">▶ Uji dengan hasil NG</button>
                <span class="muted" id="ujiStatus" style="font-size:11px;align-self:center"></span>
            </div>
            <div class="test-out" id="testOut"></div>
        </div>
    </div>

    <div class="flow-next">
        <span class="muted">Cara hasil dikirim sudah diatur. Langkah terakhir: jalankan inspeksi di lini produksi.</span>
        <button class="btn small primary" onclick="keRun()">Langkah 4 · Jalankan →</button>
    </div>
</main>

<script src="../js/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const projectName = params.get('project') || '';

let cfg = null;          // { mode, script, device, pinKelas, model[] }
let katalog = null;      // { katalog, koneksi }
let adaPerubahan = false;
let siap = false;

function back() { window.api.goTo(`project.html?name=${encodeURIComponent(projectName)}`); }
function keRun() { window.api.goTo(`run.html?project=${encodeURIComponent(projectName)}`); }

// Ditanyakan sekali, di sini, untuk SEMUA cara meninggalkan halaman - menu
// samping, tombol kembali, maupun tombol Run. Sebelumnya hanya tombol Run yang
// bertanya, dan jawabannya pun tidak berpengaruh karena beforeunload tetap
// membatalkan perpindahannya.
window.bolehTinggalkanHalaman = async () => {
    if (!adaPerubahan) return true;
    const lanjut = await tanya('Pengaturan output yang baru diubah belum disimpan.',
        { judul: 'Perubahan belum disimpan', ya: 'Lanjut tanpa menyimpan' });
    // Penanda dilepas begitu pengguna setuju, supaya beforeunload tidak
    // membatalkan perpindahan yang baru saja disetujui.
    if (lanjut) adaPerubahan = false;
    return lanjut;
};

const tandai = () => { if (siap) adaPerubahan = true; };

// ---------------- pemilihan perangkat ----------------
// Tiga pilihan sejajar: dua perangkat nyata, dan kode kustom untuk yang
// tidak tercakup keduanya. Sinyal OK/NG bawaan tetap ada sebagai pilihan
// paling sederhana, supaya project lama tidak kehilangan perilakunya.
const PILIHAN = [
    { id: 'arduino', ikon: '🔌', nama: 'Arduino',      ket: 'Kirim sinyal per kelas ke pin papan Arduino' },
    { id: 'esp32',   ikon: '📶', nama: 'ESP32',        ket: 'Sama seperti Arduino, papan ESP32' },
    { id: 'plc',     ikon: '🏭', nama: 'PLC (Modbus)',  ket: 'Tulis coil PLC lewat Modbus RTU atau TCP' },
    { id: 'signal',  ikon: '🔁', nama: 'Sinyal OK/NG', ket: 'Satu sinyal untuk hasil akhir saja (bawaan)' },
    { id: 'script',  ikon: '📝', nama: 'Kode sendiri', ket: 'Tulis sendiri cara hasilnya dikirim' },
];

function pilihanAktif() {
    if (cfg.mode === 'device') return cfg.device.jenis;
    return cfg.mode;                                  // 'signal' | 'script'
}

function renderPerangkat() {
    const aktif = pilihanAktif();
    const grid = document.getElementById('devGrid');
    grid.innerHTML = PILIHAN.map((d) => `
        <button class="dev-kartu ${d.id === aktif ? 'aktif' : ''}" data-id="${d.id}">
            <span class="dev-ikon">${d.ikon}</span>
            <span class="dev-nama">${esc(d.nama)}</span>
            <span class="dev-ket">${esc(d.ket)}</span>
        </button>`).join('');
    grid.querySelectorAll('.dev-kartu').forEach((b) => { b.onclick = () => pilihPerangkat(b.dataset.id); });

    document.getElementById('kartuScript').style.display = cfg.mode === 'script' ? '' : 'none';
    document.getElementById('kartuPin').style.display = cfg.mode === 'device' ? '' : 'none';
    const ket = document.getElementById('pinKet');
    if (ket && cfg.mode === 'device') {
        ket.textContent = (katalog.katalog[cfg.device.jenis] || {}).alamatCoil
            ? 'Tiap kelas pada model Anda menulis satu coil di PLC. Alamatnya harus cocok dengan pemetaan di program PLC Anda. Kosongkan yang tidak dipakai.'
            : 'Tiap kelas pada model Anda dikirim ke satu pin. Kosongkan pin yang tidak dipakai.';
    }

    const ring = document.getElementById('devRingkas');
    if (cfg.mode === 'device') {
        const j = katalog.katalog[cfg.device.jenis];
        const papan = j && j.papan[cfg.device.papan];
        const namaKoneksi = esc((katalog.koneksi[cfg.device.koneksi] || {}).nama || cfg.device.koneksi);
        const sambungan = cfg.device.koneksi === 'tcp'
            ? `<strong>${esc(cfg.device.host || 'IP belum diisi')}:${cfg.device.porta || 502}</strong> · unit ${cfg.device.unit || 1}`
            : (cfg.device.jenis === 'plc'
                ? `port <strong>${esc(cfg.device.port || 'belum dipilih')}</strong> · ${cfg.device.baud} 8${({ none: 'N', even: 'E', odd: 'O' })[cfg.device.paritas || 'none']}${cfg.device.stopBits || 1} · unit ${cfg.device.unit || 1}`
                : `port <strong>${esc(cfg.device.port || 'belum dipilih')}</strong> · ${cfg.device.baud} baud`);
        ring.innerHTML = papan
            ? `${esc(papan.nama)} · ${namaKoneksi} · ${sambungan} &nbsp; <a href="#" id="ubahDev">ubah</a>`
            : `Papan belum dipilih. <a href="#" id="ubahDev">atur sekarang</a>`;
        const a = document.getElementById('ubahDev');
        if (a) a.onclick = (e) => { e.preventDefault(); dialogPerangkat(cfg.device.jenis); };
    } else if (cfg.mode === 'signal') {
        ring.textContent = 'Sinyal tunggal dikirim sesuai pengaturan Arduino di Settings — 0 untuk OK, 1 untuk NG.';
    } else {
        ring.textContent = 'Kode Anda yang menentukan output; sinyal bawaan tidak dikirim lagi.';
    }
}

async function pilihPerangkat(id) {
    if (id === 'signal' || id === 'script') {
        cfg.mode = id;
        tandai(); renderPerangkat();
        return;
    }
    // Perangkat nyata: seri papan dan portnya ditanyakan dulu, karena tanpa
    // keduanya pemetaan pin tidak punya arti.
    const berubah = cfg.device.jenis !== id;
    if (berubah) {
        cfg.device.jenis = id;
        cfg.device.papan = '';
        cfg.device.baud = katalog.katalog[id].baudBawaan;
    }
    const jadi = await dialogPerangkat(id);
    if (!jadi && !cfg.device.papan) {          // dibatalkan dan belum pernah diatur
        if (berubah) cfg.device.jenis = pilihanAktif();
        return;
    }
    cfg.mode = 'device';
    tandai();
    renderPerangkat();
    await renderPin();
}

// ---------------- dialog perangkat ----------------
function dialogPerangkat(jenis) {
    return new Promise((selesai) => {
        const j = katalog.katalog[jenis];
        const latar = document.createElement('div');
        latar.className = 'tanya-latar';
        latar.innerHTML = `
            <div class="tanya-kotak" role="dialog" aria-modal="true" style="width:480px">
                <h3 class="tanya-judul">Sambungkan ${esc(j.nama)}</h3>

                <label style="display:block;font-size:12px;margin-bottom:10px">Seri papan
                    <select id="dpPapan" style="width:100%;margin-top:4px">
                        <option value="">— pilih seri —</option>
                        ${Object.entries(j.papan).map(([k, v]) =>
                            `<option value="${k}" ${cfg.device.papan === k ? 'selected' : ''}>${esc(v.nama)}</option>`).join('')}
                    </select>
                </label>

                <label style="display:block;font-size:12px;margin-bottom:10px">Cara sambung
                    <select id="dpKoneksi" style="width:100%;margin-top:4px">
                        ${Object.entries(katalog.koneksi)
                            .filter(([, v]) => !v.untuk || v.untuk.includes(jenis))
                            .map(([k, v]) =>
                            `<option value="${k}" ${cfg.device.koneksi === k ? 'selected' : ''} ${v.siap ? '' : 'disabled'}>${esc(v.nama)}${v.siap ? '' : ' — ' + esc(v.catatan)}</option>`).join('')}
                    </select>
                </label>

                <div id="dpSerial">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                        <span style="font-size:12px;font-weight:600">Port</span>
                        <button class="btn small" id="dpPindai" type="button">🔍 Pindai</button>
                        <span class="muted" id="dpStatus" style="font-size:11px"></span>
                    </div>
                    <div id="dpPort" class="dp-port"></div>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
                        <label style="font-size:12px">Baud
                            <input type="number" id="dpBaud" value="${cfg.device.baud || j.baudBawaan}" style="width:120px;margin-top:4px">
                        </label>
                        <label style="font-size:12px" id="dpParitasBungkus">Paritas
                            <select id="dpParitas" style="width:120px;margin-top:4px">
                                <option value="none" ${(cfg.device.paritas || 'none') === 'none' ? 'selected' : ''}>None (8N)</option>
                                <option value="even" ${cfg.device.paritas === 'even' ? 'selected' : ''}>Even (8E)</option>
                                <option value="odd" ${cfg.device.paritas === 'odd' ? 'selected' : ''}>Odd (8O)</option>
                            </select>
                        </label>
                        <label style="font-size:12px" id="dpStopBungkus">Stop bit
                            <select id="dpStop" style="width:90px;margin-top:4px">
                                <option value="1" ${String(cfg.device.stopBits || 1) === '1' ? 'selected' : ''}>1</option>
                                <option value="2" ${String(cfg.device.stopBits) === '2' ? 'selected' : ''}>2</option>
                            </select>
                        </label>
                    </div>
                    <p class="muted" style="font-size:11px;margin:6px 0 0" id="dpSerialKet"></p>
                </div>

                <div id="dpJaringan" style="display:none">
                    <div style="display:flex;gap:10px;flex-wrap:wrap">
                        <label style="font-size:12px;flex:1;min-width:170px">Alamat IP PLC
                            <input type="text" id="dpHost" placeholder="192.168.1.10" value="${esc(cfg.device.host || '')}" style="width:100%;margin-top:4px">
                        </label>
                        <label style="font-size:12px;width:110px">Port TCP
                            <input type="number" id="dpPorta" value="${cfg.device.porta || 502}" style="width:100%;margin-top:4px">
                        </label>
                    </div>
                </div>

                <div id="dpUnit" style="display:none;margin-top:10px">
                    <label style="font-size:12px">Unit / slave ID
                        <input type="number" id="dpUnitId" min="1" max="247" value="${cfg.device.unit || 1}" style="width:110px;margin-top:4px">
                    </label>
                    <p class="muted" style="font-size:11px;margin:6px 0 0" id="dpCatatan"></p>
                </div>

                <div class="tanya-tombol">
                    <button class="btn" id="dpBatal" type="button">Batal</button>
                    <button class="btn primary" id="dpOk" type="button">Simpan perangkat</button>
                </div>
            </div>`;
        document.body.appendChild(latar);

        let portTerpilih = cfg.device.port || '';

        const gambarPort = (daftar) => {
            const el = latar.querySelector('#dpPort');
            if (!daftar) { el.innerHTML = '<p class="muted" style="font-size:11px;margin:0">Belum dipindai.</p>'; return; }
            if (!daftar.length) {
                el.innerHTML = '<p class="muted" style="font-size:11px;margin:0">Tidak ada port serial ditemukan. '
                    + 'Pastikan papan tercolok dan drivernya terpasang (CH340 / CP210x).</p>';
                return;
            }
            el.innerHTML = daftar.map((p) => `
                <label class="dp-baris ${p.path === portTerpilih ? 'aktif' : ''}">
                    <input type="radio" name="dpPortPilih" value="${esc(p.path)}" ${p.path === portTerpilih ? 'checked' : ''}>
                    <span><strong>${esc(p.path)}</strong> ${p.kemungkinanPapan ? '<span class="dp-cocok">papan terdeteksi</span>' : ''}
                        <br><span class="muted" style="font-size:10.5px">${esc(p.nama)}</span></span>
                </label>`).join('');
            el.querySelectorAll('input[name=dpPortPilih]').forEach((r) => {
                r.onchange = () => { portTerpilih = r.value; gambarPort(daftar); };
            });
        };
        gambarPort(null);

        const pindai = async () => {
            const st = latar.querySelector('#dpStatus');
            st.textContent = 'Memindai…';
            const daftar = await window.api.devicePindai();
            // Kalau port belum pernah dipilih, sarankan yang paling mungkin -
            // tapi jangan pernah menimpa pilihan yang sudah ada.
            if (!portTerpilih) {
                const saran = daftar.find((p) => p.tebakan === jenis) || daftar.find((p) => p.kemungkinanPapan);
                if (saran) portTerpilih = saran.path;
            }
            gambarPort(daftar);
            latar.querySelector('#dpPort').dataset.sudah = '1';
            const cocok = daftar.filter((p) => p.kemungkinanPapan).length;
            st.textContent = daftar.length
                ? `${daftar.length} port ditemukan${cocok ? `, ${cocok} kemungkinan papan` : ''}.`
                : 'Tidak ada port.';
        };
        latar.querySelector('#dpPindai').onclick = pindai;

        // Medan yang tampil mengikuti cara sambungnya: Modbus TCP tidak punya
        // port serial, dan Arduino/ESP32 tidak punya unit ID.
        const aturMedan = () => {
            const kon = latar.querySelector('#dpKoneksi').value;
            const jaringan = kon === 'tcp';
            latar.querySelector('#dpSerial').style.display = jaringan ? 'none' : '';
            latar.querySelector('#dpJaringan').style.display = jaringan ? '' : 'none';
            latar.querySelector('#dpUnit').style.display = jenis === 'plc' ? '' : 'none';
            // Sketsa Arduino/ESP32 selalu 8N1; menawarkan pilihan di sana hanya
            // memberi tombol yang bisa merusak tanpa memberi manfaat.
            const utkPlc = jenis === 'plc';
            latar.querySelector('#dpParitasBungkus').style.display = utkPlc ? '' : 'none';
            latar.querySelector('#dpStopBungkus').style.display = utkPlc ? '' : 'none';
            const ket = latar.querySelector('#dpSerialKet');
            if (ket) {
                ket.textContent = utkPlc
                    ? 'Harus sama persis dengan setelan port di PLC. Bawaan spesifikasi Modbus RTU adalah 8E1 (paritas Even), tapi banyak PLC dikirim 8N1 — cek di program PLC-nya.'
                    : 'Sketsa AutomaEyes memakai 8N1. Baud harus sama dengan yang tertulis di sketsa: 9600 untuk Arduino, 115200 untuk ESP32.';
            }
            const b = j.papan[latar.querySelector('#dpPapan').value];
            const ct = latar.querySelector('#dpCatatan');
            if (ct) ct.textContent = (b && b.catatan) ? b.catatan : '';
            // Pindai sekali saja saat medan serial pertama kali tampil.
            if (!jaringan && !latar.querySelector('#dpPort').dataset.sudah) pindai();
        };
        latar.querySelector('#dpKoneksi').onchange = aturMedan;
        aturMedan();

        const tutup = (hasil) => { latar.remove(); selesai(hasil); };
        latar.querySelector('#dpBatal').onclick = () => tutup(false);
        latar.onclick = (e) => { if (e.target === latar) tutup(false); };
        latar.querySelector('#dpPapan').onchange = (e) => {
            const b = j.papan[e.target.value];
            const ct = latar.querySelector('#dpCatatan');
            if (ct) ct.textContent = (b && b.catatan) ? b.catatan : '';
        };
        latar.querySelector('#dpOk').onclick = () => {
            const papan = latar.querySelector('#dpPapan').value;
            const kon = latar.querySelector('#dpKoneksi').value;
            if (!papan) { pesan('Pilih seri papannya dulu.', 'warn'); return; }
            if (kon === 'tcp') {
                if (!latar.querySelector('#dpHost').value.trim()) { pesan('Isi alamat IP PLC-nya.', 'warn'); return; }
            } else if (!portTerpilih) {
                pesan('Pilih port yang dipakai. Tekan Pindai kalau belum muncul.', 'warn'); return;
            }
            cfg.device.jenis = jenis;
            cfg.device.papan = papan;
            cfg.device.koneksi = kon;
            cfg.device.port = portTerpilih;
            cfg.device.baud = parseInt(latar.querySelector('#dpBaud').value, 10) || j.baudBawaan;
            cfg.device.host = latar.querySelector('#dpHost').value.trim();
            cfg.device.porta = parseInt(latar.querySelector('#dpPorta').value, 10) || 502;
            cfg.device.unit = parseInt(latar.querySelector('#dpUnitId').value, 10) || 1;
            cfg.device.paritas = latar.querySelector('#dpParitas').value;
            cfg.device.stopBits = parseInt(latar.querySelector('#dpStop').value, 10) || 1;
            tandai();
            tutup(true);
        };
    });
}

// ---------------- pemetaan kelas → pin ----------------
function nilaiPin(model, kelas) {
    const m = (cfg.pinKelas || []).find((x) => x.model === model && x.kelas === kelas);
    return m || { pin: '', aktif: 'HIGH' };
}

async function renderPin() {
    const body = document.getElementById('pinBody');
    if (!cfg.model.length) {
        body.innerHTML = '<p class="muted">Project ini belum punya model. Buat model dulu di Langkah 1.</p>';
        return;
    }
    if (!cfg.device.papan) {
        body.innerHTML = '<p class="muted">Pilih seri papan dulu supaya pinnya bisa ditawarkan.</p>';
        return;
    }
    // Papan punya daftar pin yang pasti; PLC tidak - alamat coil ditentukan
    // program PLC-nya sendiri, jadi diisi bebas dan hanya dicek berupa angka.
    const pakaiAlamat = !!(katalog.katalog[cfg.device.jenis] || {}).alamatCoil;
    const pin = pakaiAlamat ? [] : await window.api.devicePin(cfg.device.jenis, cfg.device.papan);
    const labelKeluaran = pakaiAlamat ? 'Coil' : 'Pin';
    const medan = (terpilih) => pakaiAlamat
        ? `<input type="number" class="pin-sel" min="0" max="65535" style="width:92px" value="${esc(terpilih)}" placeholder="alamat">`
        : `<select class="pin-sel">` + ['<option value="">—</option>']
            .concat(pin.map((x) => `<option value="${x}" ${String(terpilih) === String(x) ? 'selected' : ''}>${x}</option>`))
            .join('') + '</select>';

    body.innerHTML = cfg.model.map((m) => `
        <div class="pin-model">
            <div class="pin-model-nama">${esc(m.nama)} <span class="muted" style="font-weight:400">· ${esc(m.jenis || '')}</span></div>
            ${m.kelas.length ? m.kelas.map((k) => {
                const v = nilaiPin(m.nama, k);
                return `<div class="pin-baris" data-model="${esc(m.nama)}" data-kelas="${esc(k)}">
                    <span class="pin-kelas">${esc(k)}</span>
                    <label class="pin-lab">${labelKeluaran} ${medan(v.pin)}</label>
                    <label class="pin-lab">Aktif saat
                        <select class="pin-aktif">
                            <option value="HIGH" ${v.aktif !== 'LOW' ? 'selected' : ''}>HIGH</option>
                            <option value="LOW" ${v.aktif === 'LOW' ? 'selected' : ''}>LOW</option>
                        </select></label>
                    <button class="btn small pin-uji" type="button" title="Nyalakan pin ini sebentar">Uji</button>
                </div>`;
            }).join('') : '<p class="muted" style="font-size:11px;margin:4px 0 0">Model ini belum punya kelas.</p>'}
        </div>`).join('');

    body.querySelectorAll('.pin-baris').forEach((row) => {
        const simpanBaris = () => {
            const model = row.dataset.model, kelas = row.dataset.kelas;
            const p = row.querySelector('.pin-sel').value;
            const a = row.querySelector('.pin-aktif').value;
            cfg.pinKelas = (cfg.pinKelas || []).filter((x) => !(x.model === model && x.kelas === kelas));
            cfg.pinKelas.push({ model, kelas, pin: p, aktif: a });
            tandai();
            tandaiBentrok();
        };
        const sel = row.querySelector('.pin-sel');
        sel.onchange = simpanBaris;
        if (sel.tagName === 'INPUT') sel.oninput = simpanBaris;
        row.querySelector('.pin-aktif').onchange = simpanBaris;
        row.querySelector('.pin-uji').onclick = () =>
            ujiPin(row.querySelector('.pin-sel').value, row.querySelector('.pin-aktif').value, cfg.device.jenis);
    });
    tandaiBentrok();
}

// Satu pin untuk dua kelas berarti keduanya tidak bisa dibedakan di sisi
// mesin. Ditandai saat itu juga, bukan ditahan sampai ditekan Simpan.
function tandaiBentrok() {
    const hitung = {};
    document.querySelectorAll('.pin-baris').forEach((row) => {
        const v = row.querySelector('.pin-sel').value;
        if (v) hitung[v] = (hitung[v] || 0) + 1;
    });
    document.querySelectorAll('.pin-baris').forEach((row) => {
        const v = row.querySelector('.pin-sel').value;
        row.classList.toggle('bentrok', !!v && hitung[v] > 1);
    });
}

// ---------------- sambungan & uji ----------------
// Papan perlu menjalankan sketsa AutomaEyes supaya mengerti baris "PINS ...".
// Tanpa itu perintahnya terkirim tapi tidak berarti apa-apa - jadi jalannya
// disediakan tepat di sebelah tombol sambung.
async function sambung() {
    const st = document.getElementById('devStatus');
    if (adaPerubahan) { pesan('Simpan dulu, supaya port yang dipakai sesuai yang Anda pilih.', 'warn'); return; }
    st.textContent = 'Menyambungkan…';
    const r = await window.api.deviceSambung(projectName);
    if (!r.ok) { st.textContent = ''; pesan('Gagal menyambung: ' + r.error, 'err'); return; }
    st.textContent = cfg.device.koneksi === 'tcp'
        ? `Tersambung ke ${r.port}.`
        : `Tersambung ke ${r.port} @ ${r.baud} baud.`;
    pesan(`Tersambung ke ${r.port}.`, 'ok');
}

async function bukaSketsa() {
    // PLC tidak punya sketsa - yang dibuka panduannya, karena di situ letak
    // penjelasan alamat coil dan cara sambungnya.
    const plc = cfg.device.jenis === 'plc';
    const r = await window.api.deviceSketsa(plc ? 'panduan' : 'sketsa');
    if (!r.ada) { pesan('Berkas panduan tidak ditemukan.', 'err'); return; }
    const b = await window.api.openPath(r.berkas);
    if (b && b.ok === false) pesan(b.error || 'Berkas tidak bisa dibuka.', 'err');
}

async function ujiPin(pin, aktif, jenis) {
    const label = jenis === 'plc' ? 'Coil' : 'Pin';
    if (!pin) { pesan(`Isi ${label.toLowerCase()}nya dulu.`, 'warn'); return; }
    const r = await window.api.deviceUjiPin(pin, aktif, jenis);
    if (!r.ok) { pesan(`Gagal menguji ${label.toLowerCase()}: ` + r.error, 'err'); return; }
    pesan(`${label} ${pin} dinyalakan 0,6 detik lalu dipadamkan.`, 'ok');
}

function bukaBantuan() {
    const lama = document.getElementById('dlgBantuan');
    if (lama) lama.remove();

    const kunci = Object.keys(BANTUAN);
    const latar = document.createElement('div');
    latar.id = 'dlgBantuan';
    latar.className = 'tanya-latar';
    latar.innerHTML = `
        <div class="tanya-kotak bantuan-kotak" role="dialog" aria-modal="true">
            <div class="bantuan-kepala">
                <h3 class="tanya-judul" style="margin:0">Bantuan &mdash; kode output</h3>
                <button class="btn small" id="bnTutup" type="button">Tutup</button>
            </div>
            <div class="tab-headers" id="bnTab">
                ${kunci.map((k, i) => `<button class="${i === 0 ? 'active' : ''}" data-k="${k}">${BANTUAN[k].judul}</button>`).join('')}
            </div>
            <div class="bantuan-isi" id="bnIsi">${BANTUAN[kunci[0]].isi}</div>
        </div>`;
    document.body.appendChild(latar);

    const tutup = () => { latar.remove(); document.removeEventListener('keydown', esc, true); };
    const esc = (e) => { if (e.key === 'Escape') { e.preventDefault(); tutup(); } };
    document.addEventListener('keydown', esc, true);
    latar.querySelector('#bnTutup').onclick = tutup;
    latar.onclick = (e) => { if (e.target === latar) tutup(); };

    latar.querySelectorAll('#bnTab button').forEach((b) => {
        b.onclick = () => {
            latar.querySelectorAll('#bnTab button').forEach((x) => x.classList.remove('active'));
            b.classList.add('active');
            latar.querySelector('#bnIsi').innerHTML = BANTUAN[b.dataset.k].isi;
            latar.querySelector('#bnIsi').scrollTop = 0;
        };
    });

    // Buka langsung di tab bahasa yang sedang dipakai, bukan selalu dari awal.
    const tabBahasa = latar.querySelector(`#bnTab button[data-k="${cfg.bahasa === 'py' ? 'py' : 'js'}"]`);
    if (tabBahasa) tabBahasa.click();
}

// Dua skrip disimpan terpisah, jadi berganti bahasa tidak menghapus kode
// yang sudah ditulis di bahasa satunya.
function gantiBahasa(b) {
    // Simpan isi kotak ke bahasa yang SEDANG dipakai, baru pindah. Saat
    // pemuatan pertama tidak ada yang perlu disimpan - kotaknya masih kosong,
    // dan menyimpannya justru menghapus skrip bawaan.
    simpanKotak();
    muatBahasa(b);
}

function muatBahasa(b) {
    cfg.bahasa = b === 'py' ? 'py' : 'js';
    document.getElementById('script').value = cfg.bahasa === 'py' ? cfg.scriptPy : cfg.script;
    document.getElementById('bahasaKet').textContent = cfg.bahasa === 'py'
        ? 'Dijalankan memakai Python yang sama dengan pelatihan model.'
        : 'Dijalankan di dalam aplikasi, tanpa perangkat lunak tambahan.';
    tandai();
}

function simpanKotak() {
    const isi = document.getElementById('script').value;
    if (cfg.bahasa === 'py') cfg.scriptPy = isi; else cfg.script = isi;
}

async function uji(verdict) {
    simpanKotak();
    const out = document.getElementById('testOut');
    const st = document.getElementById('ujiStatus');
    st.textContent = 'Menjalankan\u2026';
    const r = await window.api.testOutputScript(
        document.getElementById('script').value, verdict, cfg.bahasa);
    st.textContent = '';
    out.className = 'test-out ' + (r.ok ? 'ok' : 'err');
    out.textContent = r.ok
        ? `Skrip jalan tanpa kesalahan.\n${r.logs.join('\n')}`
        : `Kesalahan: ${r.error}\n${r.logs.join('\n')}`;
}

// ---------------- simpan ----------------
let simpanTimer = null;
function pesanSimpan(teks, jenis) {
    const el = document.getElementById('simpanMsg');
    clearTimeout(simpanTimer);
    el.textContent = teks;
    el.className = 'save-msg ' + jenis + ' tampil';
    if (jenis === 'ok') simpanTimer = setTimeout(() => el.classList.remove('tampil'), 3000);
}

async function simpan() {
    simpanKotak();
    const r = await window.api.saveOutputConfig(projectName, {
        mode: cfg.mode, bahasa: cfg.bahasa, script: cfg.script, scriptPy: cfg.scriptPy,
        device: cfg.device, pinKelas: cfg.pinKelas,
    });
    if (!r.ok) { pesanSimpan(r.masalah.join(' '), 'err'); return; }
    adaPerubahan = false;
    pesanSimpan('✓ Tersimpan', 'ok');
}

window.addEventListener('beforeunload', (e) => {
    if (adaPerubahan) { e.preventDefault(); e.returnValue = ''; }
});

async function init() {
    katalog = await window.api.deviceKatalog();
    cfg = await window.api.getOutputConfig(projectName);
    if (!cfg.device.baud) cfg.device.baud = katalog.katalog[cfg.device.jenis].baudBawaan;
    document.getElementById('bahasa').value = cfg.bahasa || 'js';
    muatBahasa(cfg.bahasa || 'js');
    document.getElementById('script').addEventListener('input', () => { simpanKotak(); tandai(); });
    renderPerangkat();
    if (cfg.mode === 'device') await renderPin();
    siap = true;
}

init();

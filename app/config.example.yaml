# ===== AutomaEyes — configuration TEMPLATE =====
#
# Automatically copied to config.yaml the first time the app runs.
# Once installed, the copy lives in the user data folder (userData), not in
# the install folder — that folder is read-only.
#
# Settings here can be changed via the Settings menu in the app.
# The login session and GitHub token are NOT stored here, but encrypted
# by the operating system.

app:
  name: AutomaEyes
  version: 0.2.3

# Site used for account login and version checks.
website:
  url: https://automaeyes.my.id

python:
  exe: python                       # or python3 / full path to python.exe
  infer_script: infer.py
  train_script: train.py
  eval_script: evaluate.py
  infer_server_script: infer_server.py

# Signal to Arduino/PLC. If no device is connected, this section
# is ignored and the app keeps running normally.
arduino:
  port: COM3
  baud: 9600
  ok_signal: '0'
  ng_signal: '1'
  signal_on_ok: false
  # Optional handshake: wait for this token in reply as a sign the gate has
  # closed again before the next detection. Leave empty to proceed immediately.
  handshake_token: ''
  handshake_timeout_ms: 5000
  # Tracking mode: signal when a part enters and leaves the frame.
  open_signal: 'O'
  close_signal: 'C'

model:
  confidence: 0.35
  iou: 0.45
  imgsz: 640

# Sweep confidence threshold via F1 on the val set. Purely statistical, no
# external service involved.
auto_calibration:
  enabled: false

paths:
  # No longer used: the projects folder now follows the connected GitHub
  # account (Documents/AutomaEyes/<github-account>). Left in place so old
  # configs still load without errors.
  projects_root: projects

output:
  save_ok_images: false

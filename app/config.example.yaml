# ===== AutomaEyes — TEMPLATE konfigurasi =====
#
# Disalin otomatis jadi config.yaml saat aplikasi pertama kali dijalankan.
# Saat terpasang, salinannya ada di folder data pengguna (userData), bukan di
# folder pemasangan — folder itu read-only.
#
# Pengaturan di sini bisa diubah lewat menu Settings di aplikasi.
# Sesi login dan token GitHub TIDAK disimpan di sini, melainkan terenkripsi
# oleh sistem operasi.

app:
  name: AutomaEyes
  version: 0.2.1

# Situs untuk login akun dan pemeriksaan versi.
website:
  url: https://automaeyes.my.id

python:
  exe: python                       # atau python3 / path lengkap ke python.exe
  infer_script: infer.py
  train_script: train.py
  eval_script: evaluate.py
  infer_server_script: infer_server.py

# Sinyal ke Arduino/PLC. Kalau tidak ada perangkat terpasang, bagian ini
# diabaikan dan aplikasi tetap berjalan normal.
arduino:
  port: COM3
  baud: 9600
  ok_signal: '0'
  ng_signal: '1'
  signal_on_ok: false
  # Handshake opsional: tunggu balasan token ini sebagai tanda gerbang sudah
  # menutup lagi sebelum deteksi berikutnya. Kosongkan untuk langsung lanjut.
  handshake_token: ''
  handshake_timeout_ms: 5000
  # Mode tracking: sinyal saat part masuk dan keluar frame.
  open_signal: 'O'
  close_signal: 'C'

model:
  confidence: 0.35
  iou: 0.45
  imgsz: 640

# Sweep confidence threshold via F1 pada val set. Murni statistik, tanpa
# layanan luar.
auto_calibration:
  enabled: false

paths:
  # Tidak dipakai lagi: folder projects mengikuti akun GitHub yang tersambung
  # (Documents/AutomaEyes/<akun-github>). Dibiarkan agar config lama tetap
  # terbaca tanpa error.
  projects_root: projects

output:
  save_ok_images: false
